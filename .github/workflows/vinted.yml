name: Vinted orologi

on:
  schedule:
    - cron: "*/10 * * * *"   # minimo 5 min; GitHub spesso ritarda, 10 è più realistico
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vinted
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Esegui ricerca
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vinted_watch.py
      - name: Salva annunci visti
        if: always()
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "aggiorna seen.json" && git push)
